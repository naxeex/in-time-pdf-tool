name: Build IN TIME PDF Tools APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'in-time-pdf-tools.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded web project ZIP
        shell: bash
        run: |
          set -e
          test -f in-time-pdf-tools.zip || { echo 'Missing in-time-pdf-tools.zip at repository root.'; exit 1; }
          mkdir -p extracted-project
          unzip -q in-time-pdf-tools.zip -d extracted-project
          # Support ZIPs containing either project files directly or one enclosing folder.
          if [ -f extracted-project/package.json ]; then
            cp -a extracted-project/. .
          else
            package_json="$(find extracted-project -mindepth 2 -maxdepth 4 -name package.json -print -quit)"
            test -n "$package_json" || { echo 'package.json was not found in the uploaded ZIP.'; find extracted-project -maxdepth 4 -type f | head -80; exit 1; }
            project_dir="$(dirname "$package_json")"
            cp -a "$project_dir"/. .
          fi
          test -f package.json || { echo 'package.json was not copied to the workspace root.'; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: |
          npm install --save @capacitor/core@^7 @capacitor/android@^7 --legacy-peer-deps
          npm install --save-dev @capacitor/cli@^7 --legacy-peer-deps

      - name: Create JSON Capacitor configuration
        run: |
          # JSON avoids the TypeScript config loader failure seen in the previous run.
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.mjs
          cat > capacitor.config.json <<'CONFIG'
          {
            "appId": "com.intimedevs.intimepdftools",
            "appName": "IN TIME PDF Tools",
            "webDir": "dist",
            "android": {
              "allowMixedContent": false
            }
          }
          CONFIG

      - name: Build web app
        run: npm run build

      - name: Verify web build output
        run: test -f dist/index.html

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: intime-pdf-tools-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create artifact with code and logo
        uses: actions/upload-artifact@v4
        with:
          name: intime-pdf-tools-source
          path: |
            *
            !.git/
            !node_modules/
            !extracted-project/
            !android/
            !dist/
            !*.zip
          retention-days: 14
          
